<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#000000">
	<title>Orbitron-D</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&amp;family=Raleway:wght@700&amp;display=swap">
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; background: #000; color: #fff; }
		body {
			font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			max-width: 28rem;
			margin: 0 auto;
			padding: 1.5rem 1.25rem 8.5rem;
		}
		.brand {
			margin: 0;
			color: #8d8d8d;
			font-size: 0.75rem;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0.2rem 0 1.25rem;
			font-family: Orbitron, "Avenir Next Condensed", sans-serif;
			font-size: 1.75rem;
			font-weight: 500;
			letter-spacing: 0.04em;
		}
		.preview {
			--u: 1.35px;
			position: sticky;
			top: 0;
			z-index: 1;
			margin: 0 -1.25rem 1.5rem;
			padding: 0 1.25rem 0.85rem;
			background: #000;
			border-bottom: 1px solid #1c1c1c;
		}
		.preview-label {
			margin: 0 0 0.65rem;
			color: #8d8d8d;
			font-size: 0.75rem;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}
		.bezel {
			width: fit-content;
			margin: 0 auto;
			padding: calc(7 * var(--u));
			border: 1px solid #2a2a2a;
			border-radius: 16px;
			background: #050505;
		}
		.face {
			position: relative;
			width: calc(144 * var(--u));
			height: calc(168 * var(--u));
			overflow: hidden;
			background: #000;
		}
		.face p { margin: 0; }
		.icon {
			position: absolute;
			object-fit: fill;
		}
		.icon[hidden] { display: none; }
		.island {
			position: absolute;
			overflow: hidden;
			border-radius: 999px;
			background: #000;
		}
		.island::after {
			content: "";
			position: absolute;
			inset: 0;
			border: 1px solid #fff;
			border-radius: inherit;
			pointer-events: none;
		}
		.island[hidden] { display: none; }
		.island .icon { position: absolute; }
		.time {
			position: absolute;
			top: calc(47 * var(--u));
			left: 0;
			width: 100%;
			height: calc(50 * var(--u));
			font-family: Orbitron, "Avenir Next Condensed", sans-serif;
			font-size: calc(36 * var(--u));
			font-weight: 500;
			line-height: calc(50 * var(--u));
			text-align: center;
		}
		.seconds, .day, .date {
			position: absolute;
			right: calc(4 * var(--u));
			font-family: Raleway, "Avenir Next Condensed", sans-serif;
			font-weight: 700;
			letter-spacing: calc(0.4 * var(--u));
			text-align: right;
			white-space: nowrap;
		}
		.seconds {
			top: calc(88 * var(--u));
			right: calc(8 * var(--u));
			font-size: calc(16 * var(--u));
			line-height: calc(18 * var(--u));
		}
		.day {
			top: calc(126 * var(--u));
			font-size: calc(15 * var(--u));
			line-height: calc(18 * var(--u));
		}
		.date {
			top: calc(146 * var(--u));
			font-size: calc(14 * var(--u));
			line-height: calc(16 * var(--u));
		}
		.preview-sample, .preview-caption {
			max-width: 22rem;
			margin: 0.7rem auto 0;
			color: #8d8d8d;
			font-size: 0.8125rem;
			text-align: center;
		}
		.preview-caption {
			min-height: 2.6em;
			margin-top: 0.2rem;
			color: #cfcfcf;
		}
		@media (max-width: 360px) {
			.preview { --u: 1.15px; }
		}
		fieldset {
			margin: 0 0 1.75rem;
			padding: 0;
			border: 0;
		}
		legend {
			margin-bottom: 0.35rem;
			padding: 0;
			color: #8d8d8d;
			font-size: 0.75rem;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}
		.choice {
			display: block;
			padding: 0.85rem 0;
			border-bottom: 1px solid #1c1c1c;
		}
		.choice[hidden] { display: none; }
		.choice input { margin-right: 0.75rem; }
		.hint {
			display: block;
			margin-top: 0.45rem;
			color: #8d8d8d;
			font-size: 0.8125rem;
		}
		.select-label {
			display: block;
			margin-top: 1rem;
		}
		.select-label span, .choice-title { display: block; margin-bottom: 0.4rem; }
		select {
			width: 100%;
			height: 2.75rem;
			padding: 0 0.6rem;
			border: 1px solid #333;
			border-radius: 0;
			background: #111;
			color: #fff;
			font: inherit;
		}
		.actions {
			position: fixed;
			right: 0;
			bottom: 0;
			left: 0;
			padding: 0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
			background: #000;
			border-top: 1px solid #222;
		}
		.actions-inner { max-width: 28rem; margin: 0 auto; }
		button {
			width: 100%;
			border: 0;
			font: inherit;
		}
		.save {
			height: 3rem;
			background: #fff;
			color: #000;
			font-family: Orbitron, "Avenir Next Condensed", sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}
		.cancel {
			height: 2.5rem;
			margin-top: 0.35rem;
			background: transparent;
			color: #8d8d8d;
		}
	</style>
</head>
<body>
	<main>
		<p class="brand">One Green Light</p>
		<h1>Orbitron-D</h1>
		<section class="preview" aria-label="Preview">
			<p class="preview-label">Preview</p>
			<div class="bezel">
				<div class="face" id="face">
					<div id="face-island" class="island" hidden>
						<img id="face-bluetooth" class="icon bluetooth" alt="Bluetooth" hidden>
						<img id="face-battery" class="icon battery" alt="Battery" hidden>
						<img id="face-vibe" class="icon vibe" alt="Vibrate" src="../resources/images/hourvibe_20_20.png" hidden>
					</div>
					<p id="face-time" class="time">10:43</p>
					<p id="face-seconds" class="seconds"></p>
					<p id="face-day" class="day">Saturday</p>
					<p id="face-date" class="date">15th Mar. 2014</p>
				</div>
			</div>
			<p class="preview-sample">Sample face. Phone connected, battery 80%.</p>
			<p id="face-caption" class="preview-caption" aria-live="polite"></p>
		</section>
		<form id="config" autocomplete="off">
			<fieldset>
				<legend>Face</legend>
				<label class="choice" id="layout-d">
					<input type="radio" name="layout" value="0" checked>
					Orbitron D
					<span class="hint">Time in the middle. Day and date sit at the bottom.</span>
				</label>
				<label class="choice">
					<input type="radio" name="layout" value="1">
					Orbitron B
					<span class="hint">Day, time, and date stacked in the middle.</span>
				</label>
				<label class="choice">
					<input type="radio" name="layout" value="2">
					Orbitron
					<span class="hint">Time only.</span>
				</label>
				<label class="choice">
					<input type="radio" name="showseonds" value="0" checked>
					Hide seconds
				</label>
				<label class="choice">
					<input type="radio" name="showseonds" value="1">
					Show seconds
					<span class="hint">Draws the seconds under the time on the Orbitron D layout. The watch wakes every second.</span>
				</label>
				<label class="choice">
					<input type="radio" name="datestyle" value="0" checked>
					15th Mar. 2014
				</label>
				<label class="choice">
					<input type="radio" name="datestyle" value="1">
					Mar., 15th 2014
				</label>
				<label class="select-label">
					<span>Language</span>
					<select id="language" name="language">
						<option value="0" selected>English</option>
						<option value="1">Deutsch</option>
						<option value="2">Español</option>
						<option value="3">Français</option>
						<option value="4">Italiano</option>
						<option value="5">Svenska</option>
						<option value="6">Dansk</option>
						<option value="7">Nederlands</option>
					</select>
				</label>
			</fieldset>

			<fieldset>
				<legend>Icons</legend>
				<label class="choice">
					<input type="radio" name="battery" value="0" checked>
					Hide the battery
					<span class="hint">The icon still appears while the watch is charging.</span>
				</label>
				<label class="choice">
					<input type="radio" name="battery" value="1">
					Show the battery at 20% or below
				</label>
				<label class="choice">
					<input type="radio" name="battery" value="2">
					Always show the battery
				</label>
				<label class="choice">
					<input type="radio" name="bluetooth" value="0" checked>
					Hide Bluetooth
				</label>
				<label class="choice">
					<input type="radio" name="bluetooth" value="1">
					Show Bluetooth when the phone is disconnected
				</label>
				<label class="choice">
					<input type="radio" name="bluetooth" value="2">
					Always show Bluetooth
				</label>
				<label class="choice">
					<input type="radio" name="connlost" value="0" checked>
					Stay quiet if the phone disconnects
				</label>
				<label class="choice">
					<input type="radio" name="connlost" value="1">
					Blink and buzz if the phone disconnects
					<span class="hint">Three short buzzes. The icon blinks for about 15 seconds.</span>
				</label>
			</fieldset>

			<fieldset>
				<legend>Buzz</legend>
				<label class="select-label">
					<span>Vibrate</span>
					<select id="vibeminutes" name="vibeminutes">
						<option value="0" selected>Off</option>
						<option value="5">Every 5 minutes</option>
						<option value="10">Every 10 minutes</option>
						<option value="15">Every 15 minutes</option>
						<option value="30">Every 30 minutes</option>
						<option value="60">Every hour</option>
					</select>
					<span class="hint">A double pulse on those minutes. Every hour pulses at the top of the hour.</span>
				</label>
			</fieldset>
			<div class="actions">
				<div class="actions-inner">
					<button class="save" type="submit">Save</button>
					<button class="cancel" id="cancel" type="button">Cancel</button>
				</div>
			</div>
		</form>
	</main>
	<script id="config-logic">
		var LANGUAGE_COUNT = 8;
		var PREVIEW_SAMPLE = {
			hourText: "10:43",
			secondsText: "42",
			wday: 6,
			month: 2,
			day: 15,
			year: 2014,
			chargePercent: 80,
			charging: false,
			connected: true
		};
		var WEEKDAY_NAMES = [
			["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
			["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"],
			["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"],
			["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"],
			["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"],
			["Söndag", "Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag"],
			["Søndag", "Mandag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"],
			["Zondag", "Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag"]
		];
		var MONTH_NAMES = [
			["Jan.", "Feb.", "Mar.", "Apr.", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."],
			["Jän.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dez."],
			["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago.", "Sep", "Oct", "Nov", "Dic"],
			["Janv.", "Févr.", "Mars", "Avril", "Mai", "Juin", "Juil.", "Août", "Sept.", "Oct.", "Nov.", "Déc."],
			["Genn.", "Febbr.", "Mar.", "Apr.", "Magg.", "Giugno", "Luglio", "Ag.", "Sett.", "Ott.", "Nov.", "Dic."],
			["Jan.", "Febr.", "Mars", "April", "Maj", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dec."],
			["Jan.", "Febr.", "Marts", "April", "Maj", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dec."],
			["Jan.", "Feb.", "Maart", "Apr.", "Mei", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dec."]
		];
		var ORDINALS = [
			["th", "st", "nd", "rd", "th", "th", "th", "th", "th", "th"],
			[".", ".", ".", ".", ".", ".", ".", ".", ".", "."],
			["º", "º", "º", "º", "º", "º", "º", "º", "º", "º"],
			["er", "", "", "", "", "", "", "", "", ""],
			["º", "º", "º", "º", "º", "º", "º", "º", "º", "º"],
			["", "", "", "", "", "", "", "", "", ""],
			[".", ".", ".", ".", ".", ".", ".", ".", ".", "."],
			[".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
		];
		var VIBE_CHOICES = [
			{ value: 0, label: "Off" },
			{ value: 5, label: "Every 5 minutes" },
			{ value: 10, label: "Every 10 minutes" },
			{ value: 15, label: "Every 15 minutes" },
			{ value: 30, label: "Every 30 minutes" },
			{ value: 60, label: "Every hour" }
		];

		function clampChoice(value, allowed, fallback) {
			var i;
			for (i = 0; i < allowed.length; i++) {
				if (allowed[i] === value) {
					return value;
				}
			}
			return fallback;
		}

		function readSettings(params) {
			function num(key, fallback) {
				var parsed;
				if (!params || !Object.prototype.hasOwnProperty.call(params, key) || params[key] === "") {
					return fallback;
				}
				parsed = parseInt(params[key], 10);
				return isNaN(parsed) ? fallback : parsed;
			}

			var language = num("language", 0);
			var vibe = num("vibeminutes", 0);

			if (language < 0 || language >= LANGUAGE_COUNT) {
				language = 0;
			}
			if (vibe < 0 || vibe > 60) {
				vibe = 0;
			}

			return {
				battery: clampChoice(num("battery", 0), [0, 1, 2], 0),
				vibeminutes: vibe,
				language: language,
				datestyle: clampChoice(num("datestyle", 0), [0, 1], 0),
				bluetooth: clampChoice(num("bluetooth", 0), [0, 1, 2], 0),
				connlost: clampChoice(num("connlost", 0), [0, 1], 0),
				showseonds: clampChoice(num("showseonds", 0), [0, 1], 0),
				layout: supportedLayout(
					clampChoice(num("layout", 0), [0, 1, 2], 0),
					isRound(params && params.round)
				)
			};
		}

		function parseQuery(search) {
			var params = {};
			var query = search.charAt(0) === "?" ? search.substring(1) : search;
			var parts;
			var i;
			if (!query) {
				return params;
			}
			parts = query.split("&");
			for (i = 0; i < parts.length; i++) {
				var pair = parts[i].split("=");
				var key;
				if (!pair[0]) {
					continue;
				}
				key = decodeURIComponent(pair[0].replace(/\+/g, " "));
				params[key] = decodeURIComponent((pair[1] || "").replace(/\+/g, " "));
			}
			return params;
		}

		function withSelected(choices, selected, labelForCustom) {
			var copy = [];
			var found = false;
			var i;
			for (i = 0; i < choices.length; i++) {
				copy.push(choices[i]);
				if (choices[i].value === selected) {
					found = true;
				}
			}
			if (!found) {
				copy.push({ value: selected, label: labelForCustom(selected) });
				copy.sort(function(a, b) { return a.value - b.value; });
			}
			return copy;
		}

		function selectedValue(name) {
			var nodes = document.getElementsByName(name);
			var i;
			for (i = 0; i < nodes.length; i++) {
				if (nodes[i].checked) {
					return nodes[i].value;
				}
			}
			return "";
		}

		function setRadio(name, value) {
			var nodes = document.getElementsByName(name);
			var i;
			for (i = 0; i < nodes.length; i++) {
				nodes[i].checked = parseInt(nodes[i].value, 10) === value;
			}
		}

		function fillSelect(select, choices, selected) {
			var i;
			select.options.length = 0;
			for (i = 0; i < choices.length; i++) {
				var option = document.createElement("option");
				option.value = String(choices[i].value);
				option.text = choices[i].label;
				option.selected = choices[i].value === selected;
				select.appendChild(option);
			}
		}

		function applySettings(settings) {
			setRadio("layout", settings.layout);
			setRadio("showseonds", settings.showseonds);
			setRadio("datestyle", settings.datestyle);
			setRadio("battery", settings.battery);
			setRadio("bluetooth", settings.bluetooth);
			setRadio("connlost", settings.connlost);
			fillSelect(
				document.getElementById("language"),
				withSelected([
					{ value: 0, label: "English" },
					{ value: 1, label: "Deutsch" },
					{ value: 2, label: "Español" },
					{ value: 3, label: "Français" },
					{ value: 4, label: "Italiano" },
					{ value: 5, label: "Svenska" },
					{ value: 6, label: "Dansk" },
					{ value: 7, label: "Nederlands" }
				], settings.language, function(value) { return "Language " + value; }),
				settings.language
			);
			fillSelect(
				document.getElementById("vibeminutes"),
				withSelected(VIBE_CHOICES, settings.vibeminutes, function(value) {
					return "Every " + value + " minutes";
				}),
				settings.vibeminutes
			);
			renderPreview(settings);
		}

		var watchRound = false;

		function isRound(value) {
			return value === 1 || value === true || value === "1"
				|| value === "chalk" || value === "gabbro";
		}

		function supportedLayout(layout, round) {
			if (round && (layout === 0 || layout < 0 || layout > 2)) {
				return 1;
			}
			if (layout !== 0 && layout !== 1 && layout !== 2) {
				return 0;
			}
			return layout;
		}

		function currentSettings() {
			return readSettings({
				battery: selectedValue("battery"),
				vibeminutes: document.getElementById("vibeminutes").value,
				language: document.getElementById("language").value,
				datestyle: selectedValue("datestyle"),
				bluetooth: selectedValue("bluetooth"),
				connlost: selectedValue("connlost"),
				showseonds: selectedValue("showseonds"),
				layout: selectedValue("layout"),
				round: watchRound ? "1" : "0"
			});
		}

		function closeWith(settings) {
			location.href = "pebblejs://close#" + encodeURIComponent(JSON.stringify(settings));
		}

		function weekdayName(language, wday) {
			if (language < 0 || language >= LANGUAGE_COUNT || wday < 0 || wday > 6) {
				return "";
			}
			return WEEKDAY_NAMES[language][wday];
		}

		function ordinalSuffix(language, day) {
			if (language < 0 || language >= LANGUAGE_COUNT || day < 0) {
				return "";
			}
			if (language === 0 && day >= 11 && day <= 13) {
				return "th";
			}
			if (language === 3 && day === 1) {
				return ORDINALS[language][day];
			}
			return ORDINALS[language][day % 10];
		}

		function formatPreviewDate(language, dateMode, day, month, year) {
			var monthName = MONTH_NAMES[language][month];
			var ordinal = ordinalSuffix(language, day);
			if (dateMode === 1) {
				return monthName + ", " + day + ordinal + " " + year;
			}
			if (dateMode === 0) {
				return day + ordinal + " " + monthName + " " + year;
			}
			return "";
		}

		function batteryVisible(mode, percent, charging) {
			return mode === 2 || (mode === 1 && percent <= 20) || charging;
		}

		function bluetoothHidden(mode, connected) {
			return mode === 0 || (mode === 1 && connected);
		}

		function statusIsland(showBluetooth, showBattery, showVibe) {
			var order = [];
			var island = {
				x: 0,
				y: 1,
				w: 0,
				h: 25,
				visible: false,
				bluetooth: { x: 0, y: 0, w: 45, h: 16, visible: false },
				battery: { x: 0, y: 0, w: 50, h: 16, visible: false },
				vibe: { x: 0, y: 0, w: 20, h: 20, visible: false }
			};
			var gap = 3;
			var padX = 4;
			var content = 0;
			var cursor;
			var i;

			if (showBluetooth) {
				order.push(island.bluetooth);
			}
			if (showBattery) {
				order.push(island.battery);
			}
			if (showVibe) {
				order.push(island.vibe);
			}
			if (order.length === 0) {
				return island;
			}
			for (i = 0; i < order.length; i++) {
				content += order[i].w;
				if (i > 0) {
					content += gap;
				}
			}
			island.visible = true;
			island.w = content + padX * 2;
			island.x = Math.floor((144 - island.w) / 2);
			cursor = padX;
			for (i = 0; i < order.length; i++) {
				order[i].visible = true;
				order[i].x = cursor;
				order[i].y = Math.floor((island.h - order[i].h) / 2);
				cursor += order[i].w + gap;
			}
			return island;
		}

		function batteryFile(percent, charging) {
			var step = Math.floor(percent / 10);
			if (step < 0) {
				step = 0;
			}
			if (step > 10) {
				step = 10;
			}
			return (charging ? "charging_" : "battery_") + (step * 10) + ".png";
		}

		var FACE_ALIGN_CENTER = 1;
		var FACE_ALIGN_RIGHT = 2;

		function layoutFrames(layout, secondsOn) {
			var time = { x: 0, y: 47, w: 144, h: 50, align: FACE_ALIGN_CENTER, visible: true };
			var seconds = { x: 0, y: 88, w: 136, h: 20, align: FACE_ALIGN_RIGHT, visible: false };
			var day = { x: 0, y: 128, w: 142, h: 20, align: FACE_ALIGN_RIGHT, visible: true };
			var date = { x: 0, y: 146, w: 142, h: 18, align: FACE_ALIGN_RIGHT, visible: true };

			if (layout === 1) {
				day = { x: 0, y: 32, w: 144, h: 22, align: FACE_ALIGN_CENTER, visible: true };
				time = { x: 0, y: 51, w: 144, h: 50, align: FACE_ALIGN_CENTER, visible: true };
				date = { x: 0, y: 91, w: 144, h: 24, align: FACE_ALIGN_CENTER, visible: true };
			} else if (layout === 2) {
				day.visible = false;
				date.visible = false;
			} else if (secondsOn) {
				seconds.visible = true;
			}
			return { time: time, seconds: seconds, day: day, date: date };
		}

		function previewCaption(settings) {
			var parts = [];
			if (settings.round) {
				parts.push("Orbitron D stays off on a round watch.");
			}
			if (settings.layout === 2) {
				parts.push("Day, date, and seconds stay off.");
			} else if (settings.layout === 1 && settings.showseonds === 1) {
				parts.push("Seconds stay off on this layout.");
			}
			if (settings.battery === 0) {
				parts.push("Battery shows only while charging.");
			} else if (settings.battery === 1) {
				parts.push("Battery shows at 20% or below, and while charging.");
			}
			if (settings.bluetooth === 1) {
				parts.push("Bluetooth shows when the phone disconnects.");
			}
			if (settings.connlost === 1) {
				parts.push("A disconnect blinks the icon and buzzes three times.");
			}
			if (settings.vibeminutes === 0) {
				parts.push("Vibrate is off.");
			} else if (settings.vibeminutes === 60) {
				parts.push("Double pulse each hour.");
			} else {
				parts.push("Double pulse every " + settings.vibeminutes + " minutes.");
			}
			return parts.join(" ");
		}

		function previewFace(settings, round) {
			var sample = PREVIEW_SAMPLE;
			var useRound = !!round || isRound(settings && settings.round);
			var layout = supportedLayout(settings.layout, useRound);
			var slots = layoutFrames(layout, settings.showseonds === 1);
			var showBattery = batteryVisible(settings.battery, sample.chargePercent, sample.charging);
			var showBluetooth = !bluetoothHidden(settings.bluetooth, sample.connected);
			var captionSettings = {
				layout: layout,
				showseonds: settings.showseonds,
				battery: settings.battery,
				bluetooth: settings.bluetooth,
				connlost: settings.connlost,
				vibeminutes: settings.vibeminutes,
				round: useRound
			};
			return {
				time: sample.hourText,
				seconds: slots.seconds.visible ? sample.secondsText : "",
				day: weekdayName(settings.language, sample.wday),
				date: formatPreviewDate(settings.language, settings.datestyle, sample.day, sample.month, sample.year),
				slots: slots,
				island: statusIsland(showBluetooth, showBattery, settings.vibeminutes > 0),
				batteryVisible: showBattery,
				batterySrc: "../resources/images/" + batteryFile(sample.chargePercent, sample.charging),
				bluetoothVisible: showBluetooth,
				bluetoothSrc: "../resources/images/" + (sample.connected ? "bluetooth_on.png" : "bluetooth_off.png"),
				caption: previewCaption(captionSettings)
			};
		}

		function setText(id, text) {
			var node = document.getElementById(id);
			if (node) {
				node.textContent = text;
			}
		}

		function setIcon(id, visible, src) {
			var node = document.getElementById(id);
			if (!node) {
				return;
			}
			node.hidden = !visible;
			if (src) {
				node.src = src;
			}
		}

		function placeSlot(id, slot) {
			var node = document.getElementById(id);
			if (!node) {
				return;
			}
			node.hidden = !slot.visible;
			node.style.top = "calc(" + slot.y + " * var(--u))";
			node.style.textAlign = slot.align === FACE_ALIGN_RIGHT ? "right" : "center";
			if (slot.align === FACE_ALIGN_RIGHT) {
				node.style.left = "auto";
				node.style.right = "calc(" + (144 - (slot.x + slot.w)) + " * var(--u))";
				node.style.width = "auto";
			} else {
				node.style.left = "0";
				node.style.right = "0";
				node.style.width = "100%";
			}
		}

		function placeIcon(id, slot) {
			var node = document.getElementById(id);
			if (!node) {
				return;
			}
			node.hidden = !slot.visible;
			node.style.left = "calc(" + slot.x + " * var(--u))";
			node.style.top = "calc(" + slot.y + " * var(--u))";
			node.style.width = "calc(" + slot.w + " * var(--u))";
			node.style.height = "calc(" + slot.h + " * var(--u))";
		}

		function placeIsland(island) {
			var node = document.getElementById("face-island");
			if (!node) {
				return;
			}
			node.hidden = !island.visible;
			node.style.left = "calc(" + island.x + " * var(--u))";
			node.style.top = "calc(" + island.y + " * var(--u))";
			node.style.width = "calc(" + island.w + " * var(--u))";
			node.style.height = "calc(" + island.h + " * var(--u))";
			placeIcon("face-bluetooth", island.bluetooth);
			placeIcon("face-battery", island.battery);
			placeIcon("face-vibe", island.vibe);
		}

		function renderPreview(settings) {
			var face;
			var layoutD;
			if (typeof document === "undefined" || !document.getElementById) {
				return;
			}
			layoutD = document.getElementById("layout-d");
			if (layoutD) {
				layoutD.hidden = watchRound;
			}
			face = previewFace(settings, watchRound);
			setText("face-time", face.time);
			setText("face-seconds", face.seconds);
			setText("face-day", face.day);
			setText("face-date", face.date);
			setText("face-caption", face.caption);
			placeSlot("face-time", face.slots.time);
			placeSlot("face-seconds", face.slots.seconds);
			placeSlot("face-day", face.slots.day);
			placeSlot("face-date", face.slots.date);
			setIcon("face-battery", face.batteryVisible, face.batterySrc);
			setIcon("face-bluetooth", face.bluetoothVisible, face.bluetoothSrc);
			placeIsland(face.island);
		}

		function boot() {
			var params;
			if (typeof document === "undefined" || !document.getElementById) {
				return;
			}
			params = parseQuery(window.location.search);
			watchRound = isRound(params.round);
			applySettings(readSettings(params));
			document.getElementById("config").onsubmit = function(event) {
				if (event && event.preventDefault) {
					event.preventDefault();
				}
				closeWith(currentSettings());
				return false;
			};
			document.getElementById("cancel").onclick = function() {
				location.href = "pebblejs://close";
			};
			document.getElementById("config").onchange = function() {
				renderPreview(currentSettings());
			};
		}

		boot();
	</script>
</body>
</html>
